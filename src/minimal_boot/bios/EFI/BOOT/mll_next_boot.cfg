# MLL EFI Stub Chainloader — Next Boot Configuration
#
# This file is read by the Linux kernel EFI stub at boot time.
# Place it at \EFI\BOOT\mll_next_boot.cfg on the EFI system partition.
#
# FORMAT
# ------
# One meaningful line (all other lines are blank or start with '#'):
#
#   \EFI\path\to\app.efi
#       Load and start the specified EFI application on EVERY boot.
#       The file remains in place; remove it to revert to normal boot.
#
#   once:\EFI\path\to\app.efi
#       Load and start the specified EFI application ONCE.
#       Before StartImage() is called this file is overwritten with a
#       comment so subsequent boots return to normal kernel boot.
#
# EXAMPLES
# --------
# Boot Windows Boot Manager once, then return to Linux:
#   once:\EFI\Microsoft\Boot\bootmgfw.efi
#
# Always boot a custom UEFI shell:
#   \EFI\tools\shell.efi
#
# Boot a rescue system stored on the same EFI partition:
#   once:\EFI\rescue\grubx64.efi
#
# USAGE
# -----
# To set the next boot target from within a running MLL system, write
# the desired entry to this file on the mounted EFI partition, e.g.:
#
#   mount /dev/sda1 /mnt/efi
#   echo 'once:\EFI\Microsoft\Boot\bootmgfw.efi' \
#       > /mnt/efi/EFI/BOOT/mll_next_boot.cfg
#   umount /mnt/efi
#
# NOTES
# -----
# * Paths use backslash (\) as the separator, as required by UEFI.
# * The file must be plain ASCII; UTF-8 multi-byte sequences are not
#   supported in the path value.
# * If the target EFI image cannot be loaded, or if this file is absent
#   or contains only comments/blank lines, the kernel boots normally.

# Uncomment and edit one of the lines below to activate chainloading:
# once:\EFI\Microsoft\Boot\bootmgfw.efi
# \EFI\tools\shell.efi
